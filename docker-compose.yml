# Local / staging stack: Mongo (replica set) + Redis + API + worker
# Usage:
#   cp .env.example .env   # fill JWT secrets
#   docker compose up -d --build
#   curl http://localhost:5000/healthz

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "try { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] }) } catch(e) {} rs.status().ok ? db.adminCommand('ping') : quit(1)"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 20s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build: .
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/dashboardthangtinhoc?replicaSet=rs0
      REDIS_URL: redis://redis:6379
      QUEUE_PRODUCER_ONLY: "1"
      RUN_QUEUE_WORKERS: "0"
      RUN_OUTBOX_WORKER: "0"
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:5173}
      MASTER_ADMIN_PASSWORD: ${MASTER_ADMIN_PASSWORD:-}
      BACKUP_SCHEDULE: ${BACKUP_SCHEDULE:-1}
      # CQRS auto-on với replicaSet URI; kill-switch: ENABLE_CQRS=false
      ENABLE_CQRS: ${ENABLE_CQRS:-}
      ENABLE_CQRS_STUDENT_CREATE: ${ENABLE_CQRS_STUDENT_CREATE:-}
      ENABLE_CQRS_TEACHER: ${ENABLE_CQRS_TEACHER:-}
      ENABLE_CQRS_INVOICE: ${ENABLE_CQRS_INVOICE:-}
      ENABLE_CQRS_FINANCE: ${ENABLE_CQRS_FINANCE:-}
    volumes:
      - api_uploads:/app/uploads
      - api_backups:/app/backups
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    restart: unless-stopped
    command: ["node", "worker.js"]
    healthcheck:
      disable: true
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      MONGODB_URI: mongodb://mongo:27017/dashboardthangtinhoc?replicaSet=rs0
      REDIS_URL: redis://redis:6379
      RUN_QUEUE_WORKERS: "1"
      QUEUE_PRODUCER_ONLY: "0"
      RUN_OUTBOX_WORKER: "1"
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:5173}
      MASTER_ADMIN_PASSWORD: ${MASTER_ADMIN_PASSWORD:-}
    volumes:
      - api_uploads:/app/uploads
      - api_backups:/app/backups
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started

volumes:
  mongo_data:
  api_uploads:
  api_backups:
