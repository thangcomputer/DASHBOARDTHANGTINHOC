name: Node CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: CQRS TX (memory replica)
        run: npm run test:cqrs

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      # Lint client đang fail sẵn trên main (hàng trăm rule React Compiler) — giữ build bắt buộc
      - run: npm run build

  smoke-api:
    runs-on: ubuntu-latest
    needs: [backend]
    env:
      NODE_ENV: development
      PORT: 5000
      MONGODB_URI: mongodb://127.0.0.1:27017/dashboardthangtinhoc_ci?replicaSet=rs0
      JWT_SECRET: ci_jwt_secret_must_be_at_least_32_chars_long
      JWT_REFRESH_SECRET: ci_refresh_secret_must_be_at_least_32_chars
      CLIENT_URL: http://localhost:5173
      BACKUP_SCHEDULE: '0'
      RUN_OUTBOX_WORKER: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Start Mongo replica set
        run: |
          docker run -d --name mongo-rs -p 27017:27017 mongo:7 --replSet rs0 --bind_ip_all
          for i in $(seq 1 30); do
            if docker exec mongo-rs mongosh --quiet --eval 'db.adminCommand("ping").ok' 2>/dev/null | grep -q 1; then
              break
            fi
            sleep 1
          done
          docker exec mongo-rs mongosh --quiet --eval 'try { rs.status() } catch (e) { rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "127.0.0.1:27017" }] }) }'
          for i in $(seq 1 30); do
            if docker exec mongo-rs mongosh --quiet --eval 'rs.isMaster().ismaster' 2>/dev/null | grep -q true; then
              echo "replica set primary ready"
              exit 0
            fi
            sleep 1
          done
          echo "replica set not ready" >&2
          exit 1
      - name: Start API
        run: |
          nohup node server.js > /tmp/api.log 2>&1 &
          echo $! > /tmp/api.pid
      - name: Wait for healthz
        run: node scripts/wait-for-health.cjs http://127.0.0.1:5000/healthz 90000
      - name: Smoke API
        run: npm run smoke:api
      - name: CQRS smoke (live RS)
        run: npm run cqrs:smoke
      - name: API logs on failure
        if: failure()
        run: cat /tmp/api.log || true
