services:
  mongo-phase15:
    image: mongo:7
    command: ["mongod", "--bind_ip_all"]
    ports:
      - "127.0.0.1:27019:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 3s
