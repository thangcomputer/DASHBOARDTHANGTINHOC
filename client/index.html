<!doctype html>
<html lang="vi" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="color-scheme" content="light" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" id="app-favicon" />
    <!-- Admin zone swaps to /favicon-admin.svg via FaviconSwitcher -->
    <title>Thắng Tin Học - LMS</title>
  </head>
  <body>
    <a class="skip-to-content" href="#main-content">Bỏ qua đến nội dung chính</a>
    <div id="root">
      <div id="app-preloader" style="position:fixed;inset:0;z-index:999999;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(248,250,252,0.85);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font-family:system-ui,-apple-system,sans-serif;color:#1e293b;user-select:none;">
        <style>
          @keyframes htmlGravBounce {
            0% { transform: translateY(0); animation-timing-function: cubic-bezier(0.33, 1, 0.68, 1); }
            50% { transform: translateY(-40px); animation-timing-function: cubic-bezier(0.32, 0, 0.67, 0); }
            100% { transform: translateY(0); }
          }
          @keyframes htmlRubberMorph {
            0% { transform: scale(1.4, 0.6); }
            5% { transform: scale(0.9, 1.1); }
            15% { transform: scale(1, 1); }
            50% { transform: scale(1, 1); }
            85% { transform: scale(0.9, 1.1); }
            100% { transform: scale(1.4, 0.6); }
          }
          @keyframes htmlShadowBreathe {
            0% { transform: scale(1.4); opacity: 0.6; }
            50% { transform: scale(0.5); opacity: 0.1; }
            100% { transform: scale(1.4); opacity: 0.6; }
          }
          @keyframes htmlRippleExpand {
            0% { transform: scale(0.5); opacity: 0; border-width: 4px; }
            5% { opacity: 0.8; }
            30% { transform: scale(1.5); opacity: 0; border-width: 0px; }
            100% { transform: scale(1.5); opacity: 0; }
          }
          .kdot-col { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 80px; width: 24px; }
          .kdot-ball-wrap { position: relative; width: 20px; height: 20px; z-index: 10; animation: htmlGravBounce 1.4s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite; will-change: transform; }
          .kdot-ball { width: 100%; height: 100%; border-radius: 50%; background: linear-gradient(180deg, #67e8f9 0%, #2563eb 100%); box-shadow: 0 0 15px rgba(6,182,212,0.6); animation: htmlRubberMorph 1.4s linear infinite; will-change: transform; position: relative; }
          .kdot-specular { position: absolute; top: 4px; left: 4px; width: 6px; height: 6px; background: rgba(255,255,255,0.7); border-radius: 50%; filter: blur(0.5px); }
          .kdot-ripple { position: absolute; bottom: 0; width: 40px; height: 12px; border: 1px solid rgba(6,182,212,0.3); border-radius: 100%; opacity: 0; animation: htmlRippleExpand 1.4s linear infinite; }
          .kdot-shadow { position: absolute; bottom: -4px; width: 20px; height: 6px; border-radius: 100%; background: rgba(6,182,212,0.4); filter: blur(4px); animation: htmlShadowBreathe 1.4s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite; }
        </style>
        <div style="display:flex;gap:20px;">
          <div class="kdot-col"><div class="kdot-ball-wrap" style="animation-delay:0s;"><div class="kdot-ball" style="animation-delay:0s;"><div class="kdot-specular"></div></div></div><div class="kdot-ripple" style="animation-delay:0s;"></div><div class="kdot-shadow" style="animation-delay:0s;"></div></div>
          <div class="kdot-col"><div class="kdot-ball-wrap" style="animation-delay:0.15s;"><div class="kdot-ball" style="animation-delay:0.15s;"><div class="kdot-specular"></div></div></div><div class="kdot-ripple" style="animation-delay:0.15s;"></div><div class="kdot-shadow" style="animation-delay:0.15s;"></div></div>
          <div class="kdot-col"><div class="kdot-ball-wrap" style="animation-delay:0.3s;"><div class="kdot-ball" style="animation-delay:0.3s;"><div class="kdot-specular"></div></div></div><div class="kdot-ripple" style="animation-delay:0.3s;"></div><div class="kdot-shadow" style="animation-delay:0.3s;"></div></div>
          <div class="kdot-col"><div class="kdot-ball-wrap" style="animation-delay:0.45s;"><div class="kdot-ball" style="animation-delay:0.45s;"><div class="kdot-specular"></div></div></div><div class="kdot-ripple" style="animation-delay:0.45s;"></div><div class="kdot-shadow" style="animation-delay:0.45s;"></div></div>
        </div>
        <div style="margin-top:14px;font-size:16px;font-weight:700;color:#1e293b;letter-spacing:0.02em;">Đang tải dữ liệu…</div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
